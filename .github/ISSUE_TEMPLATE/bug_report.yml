name: 🐞 Report a problem
description: Something didn't work. Tell us and we'll fix it.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Crumbs better! 🙏
        Short answers are fine. Please don't share passwords or private files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: "Example: I removed Spotify, but Crumbs said it couldn't move one file."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do just before?
      placeholder: |
        1. Opened Crumbs
        2. Picked Spotify
        3. Clicked Move to Trash
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Example: All files go to the Trash."
  - type: input
    id: version
    attributes:
      label: Crumbs version
      description: Filled in for you if you used Crumbs → Report a Problem.
      placeholder: "1.3"
  - type: dropdown
    id: computer
    attributes:
      label: Your computer
      options:
        - Mac with Apple silicon (M1, M2, M3, M4…)
        - Mac with Intel
        - Windows PC
        - Not sure
  - type: input
    id: os
    attributes:
      label: System version
      description: Filled in for you if you used Report a Problem in Crumbs.
      placeholder: "macOS 26.1, or Windows 11"
  - type: dropdown
    id: fda
    attributes:
      label: "Mac only: is Full Disk Access turned on for Crumbs?"
      options:
        - "Yes"
        - "No"
        - Not sure / I use Windows
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots help a lot)
      description: Drag a screenshot here if you have one.

name: Windows

# Crumbs for Windows: built and tested on a real Windows PC for every change.
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run the tests (a fake program, fake leftovers, fake registry entries)
        run: dotnet test windows/Tests -c Release --logger "console;verbosity=normal"
      - name: Build Crumbs.exe for normal PCs (x64) and ARM PCs
        shell: pwsh
        run: |
          $v = ([xml](Get-Content windows/Directory.Build.props)).Project.PropertyGroup.Version
          $v = $v -replace '\.0$', ''   # 1.4.0 -> 1.4, 1.4.1 stays 1.4.1
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish windows/App -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o "out/$rid"
            $arch = $rid.Replace("win-", "")
            Compress-Archive -Path "out/$rid/Crumbs.exe" -DestinationPath "Windows-Crumbs-$v-$arch.zip" -Force
          }
          Get-ChildItem Windows-Crumbs-*.zip | Format-Table Name, Length
      - name: Open Crumbs and take a screenshot (checks it starts and doesn't crash)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out/win-x64/Crumbs.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Crumbs closed by itself (exit code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot-windows.png")
          Stop-Process -Id $p.Id
          # Second screenshot: one program's leftovers
          $p = Start-Process -FilePath "out/win-x64/Crumbs.exe" -ArgumentList "--show","7-Zip" -PassThru
          Start-Sleep -Seconds 14
          if ($p.HasExited) { throw "Crumbs closed by itself on the program screen" }
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot-windows-program.png")
          Stop-Process -Id $p.Id
          "Crumbs ran for 12 seconds without crashing."
      - uses: actions/upload-artifact@v4
        with:
          name: Crumbs-for-Windows
          path: Windows-Crumbs-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot-windows*.png
